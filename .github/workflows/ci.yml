name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[test]"
      - run: python -m pytest
      - run: python -m ttc.cli
      - name: Check TLA+ spec and property catalog
        run: |
          test -f formal/tla/Scheduler.tla
          grep -q EvidenceBeforeSuccess formal/tla/Scheduler.tla
          grep -q NoStaleWin formal/tla/Scheduler.tla
          test -f contracts/properties/ttc-properties-v1.json
          test -f mutmut.toml
