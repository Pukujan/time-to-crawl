[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "time-to-crawl"
version = "0.1.0"
description = "Time to Crawl: policy-bounded general-purpose acquisition and extraction platform"
requires-python = ">=3.11"
dependencies = [
  "jsonschema>=4.23,<5",
  "zstandard>=0.23,<1",
]

[project.optional-dependencies]
test = ["pytest>=8,<9", "hypothesis>=6,<7"]

[project.scripts]
ttc = "ttc.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
src = ["src", "tests"]
